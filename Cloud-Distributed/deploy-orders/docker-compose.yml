version: '3.9'
services:
  orders-service-rest:
    build:
      context: ./orders-service-rest
      dockerfile: Dockerfile
    container_name: diploma_orders_rest
    restart: unless-stopped
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://diploma:diploma_pass@10.186.0.2:5432/diploma_db?schema=orders_rest&connection_limit=150
      - USERS_SERVICE_URL=http://10.186.0.6:3002
      - UV_THREADPOOL_SIZE=64
    ports:
      - '3004:3004'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  orders-service-rpc:
    build:
      context: ./orders-service-rpc
      dockerfile: Dockerfile
    container_name: diploma_orders_rpc
    restart: unless-stopped
    environment:
      - PORT=3005
      - DATABASE_URL=postgresql://diploma:diploma_pass@10.186.0.2:5432/diploma_db?schema=orders_rpc&connection_limit=150
      - USERS_SERVICE_RPC_URL=http://10.186.0.6:3003/rpc
      - UV_THREADPOOL_SIZE=64
    ports:
      - '3005:3005'
      - '5005:5005'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
