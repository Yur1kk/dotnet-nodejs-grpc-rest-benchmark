version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: diploma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diploma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diploma_pass}
      POSTGRES_DB: ${POSTGRES_DB:-diploma_db}
    command: ["postgres", "-c", "max_connections=1500", "-c", "shared_buffers=4GB", "-c", "effective_cache_size=12GB", "-c", "work_mem=64MB", "-c", "maintenance_work_mem=512MB"]
    ports:
      - '5432:5432'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: '1gb'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U diploma']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      diploma_default:
        aliases:
          - postgres

  influxdb:
    image: influxdb:1.8
    container_name: diploma_influxdb
    restart: unless-stopped
    ports:
      - '8086:8086'
    environment:
      - INFLUXDB_HTTP_AUTH_ENABLED=false
      - INFLUXDB_DATA_MAX_VALUES_PER_TAG=0
      - INFLUXDB_DATA_MAX_SERIES_PER_DATABASE=0
    volumes:
      - influxdb_data:/var/lib/influxdb
      - ./influxdb/init:/docker-entrypoint-initdb.d
    mem_limit: 2g
    networks:
      - diploma_default

  grafana:
    image: grafana/grafana:latest
    container_name: diploma_grafana
    ports:
      - '3006:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/rest-vs-rpc-v2.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - diploma_default

networks:
  diploma_default:
    name: diploma_default
    driver: bridge

volumes:
  postgres_data:
  influxdb_data:
  grafana_data:
