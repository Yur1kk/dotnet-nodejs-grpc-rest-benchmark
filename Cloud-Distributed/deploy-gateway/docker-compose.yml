version: '3.9'
services:
  rest-api-gateway:
    build:
      context: ./rest-api-gateway
      dockerfile: Dockerfile
    container_name: diploma_rest_gateway
    restart: unless-stopped
    environment:
      - PORT=3000
      - USERS_SERVICE_URL=http://${USERS_HOST:-10.186.0.6}:3002
      - ORDERS_SERVICE_URL=http://${ORDERS_HOST:-10.186.0.4}:3004
      - DEFAULT_LIMIT=100
      - UV_THREADPOOL_SIZE=64
    ports:
      - '3000:3000'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  rpc-api-gateway:
    build:
      context: ./rpc-api-gateway
      dockerfile: Dockerfile
    container_name: diploma_rpc_gateway
    restart: unless-stopped
    environment:
      - PORT=3001
      - USERS_SERVICE_GRPC_URL=${USERS_HOST:-10.186.0.6}:5003
      - ORDERS_SERVICE_GRPC_URL=${ORDERS_HOST:-10.186.0.4}:5005
      - DEFAULT_LIMIT=100
      - UV_THREADPOOL_SIZE=64
    ports:
      - '3001:3001'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
