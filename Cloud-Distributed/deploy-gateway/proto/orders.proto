syntax = "proto3";

package orders;

service OrdersService {
  rpc GetOrders (GetOrdersRequest) returns (GetOrdersResponse);
  rpc GetOrder (GetOrderRequest) returns (OrderMessage);
  rpc CreateOrder (CreateOrderRequest) returns (OrderMessage);
  rpc UpdateOrder (UpdateOrderRequest) returns (OrderMessage);
  rpc DeleteOrder (DeleteOrderRequest) returns (OrderMessage);
}

message OrderMessage {
  string id = 1;
  string userId = 2;
  string product = 3;
  int32 quantity = 4;
  double price = 5;
  string status = 6;
  string createdAt = 7;
  string updatedAt = 8;
}

message GetOrdersRequest {
  int32 page = 1;
  int32 limit = 2;
}

message PaginationMeta {
  int32 total = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 totalPages = 4;
}

message GetOrdersResponse {
  repeated OrderMessage data = 1;
  PaginationMeta meta = 2;
}

message GetOrderRequest {
  string id = 1;
}

message CreateOrderRequest {
  string userId = 1;
  string product = 2;
  int32 quantity = 3;
  double price = 4;
  string status = 5;
}

message UpdateOrderRequest {
  string id = 1;
  string userId = 2;
  string product = 3;
  int32 quantity = 4;
  double price = 5;
  string status = 6;
}

message DeleteOrderRequest {
  string id = 1;
}
